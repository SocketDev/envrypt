[package]
name = "envrypt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Read a .env, resolve the private key from an env-var/keychain provider chain, and decrypt `encrypted:` values (Rust library, no CLI)."
keywords = ["dotenv", "env", "encryption", "secrets", "keychain"]
categories = ["config", "cryptography"]
readme = "README.md"

# The criterion regression gate runs `cargo bench -p envrypt
# -- --save-baseline <name>`, a criterion-only flag. By default `cargo bench` ALSO runs the
# lib target's built-in libtest harness, which rejects `--save-baseline` and errors before
# any criterion bench runs (`error: Unrecognized option: 'save-baseline'`). Disabling `bench`
# on the lib leaves the `[[bench]]` criterion binaries as the only bench targets, so the gate
# flag reaches only the harness that understands it. `cargo test` / unit coverage is
# unaffected — this toggles the `bench` profile for the lib target only.
[lib]
bench = false

# Fuzz targets built by cargo-fuzz set the build-wide `--cfg fuzzing`. Under that
# cfg, `parse::expand` shrinks its iteration cap and output byte budget to
# fuzz-sized values, and `crypto` exposes a raw-wire-payload decrypt entry.
# Declaring the cfg here keeps `#[cfg(fuzzing)]` out of the `unexpected_cfgs`
# warning (clippy `-D warnings` under `--all-features` would otherwise fail). No
# default or normal build sets it, so production and `cargo test`/`--all-features`
# behavior is byte-for-byte unchanged.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[features]
# No feature flags: the default build is the only build. No build path carries an
# HTTP or async dependency; `cargo tree -e normal` shows no
# ureq/tokio/reqwest/hyper/openssl-sys. CI enforces this.
default = []

[dev-dependencies]
# test-support is a dev-dependency ONLY — it must never enter envrypt's
# `-e normal` dependency tree.
test-support = { workspace = true }
tempfile = { workspace = true }
# serde_json is a NORMAL dep (see [dependencies]) — no separate dev edge needed.
# envrypt pulls no async runtime anywhere, dev tree included.
# criterion powers the micro-benches. Dev and bench only: it is not a
# `[dependencies]` entry, so it never enters envrypt's shipped `-e normal` tree.
# The benches (`benches/*.rs`) link default features, so they exercise the
# parse/crypto/keyring core with no HTTP stack.
criterion = { workspace = true }
# Spec-exact v3 probes (tests/crypto_v3.rs): the key schedule, commitment, and
# AEAD are re-derived straight from docs/envrypt/crypto-v3.md with these crates
# directly and compared byte-for-byte against the library's output. Dev-only
# edges to crates already in [dependencies] (same pins), so the shipped
# `-e normal` tree is unchanged.
x25519-dalek = { workspace = true }
chacha20poly1305 = { workspace = true }
argon2 = { workspace = true }
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
rand_core = { workspace = true }
# Tier-1 property tests (`#[cfg(test)] mod tests` next to the parsers/decoders):
# never-panic on arbitrary input, decode(encode(x)) == x round-trips, and
# recipient round-trip identity. proptest's explicit `Strategy` objects give
# better shrinking than quickcheck. Dev-only — never in the shipped `-e normal`
# tree. `default-features = false` drops the `fork`/`timeout` (rusty-fork) and
# regex machinery this suite does not use, keeping the dev tree lean.
proptest = { version = "1", default-features = false, features = ["std"] }

[dependencies]
# `encrypted:` v1 crypto (docs/envrypt/crypto-formats.md §1.3): manual ECIES
# assembly from k256 + hkdf/sha2 + aes-gcm, all pure Rust, no openssl-sys. The
# `ecies` crate cannot express this exact construction: its dependency graph
# carries `openssl`, and no feature selects a pure-Rust AES backend + secp256k1 +
# 16-byte nonce alone. Assembling it here gives direct control of the failure
# conditions the error taxonomy needs (§1.4).
aes-gcm = { version = "0.10", default-features = false, features = [
  "aes",
  "alloc",
] }
hkdf = { version = "0.12", default-features = false }
k256 = { version = "0.13", default-features = false, features = [
  "arithmetic",
  "std",
] }
rand_core = { version = "0.6", default-features = false, features = [
  "getrandom",
] }
sha2 = { version = "0.10", default-features = false }

# v3 value-format crypto (docs/envrypt/crypto-v3.md; `src/crypto_v3.rs`): X25519
# recipient ECDH + XChaCha20-Poly1305 AEAD + Argon2id passphrase KDF + a
# constant-time key-commitment compare (`subtle`). Pure Rust — the dependency
# budget (no openssl-sys/tokio/reqwest/hyper) holds; CI's positive allowlist
# audits the exact transitive closure. Versions pinned at the workspace root.
x25519-dalek = { workspace = true }
chacha20poly1305 = { workspace = true }
argon2 = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }

# `aes`/`cipher`/`pbkdf2` enter the tree ONLY as audited transitive deps of
# `aes-gcm` (→ aes/cipher) and `scrypt` (→ pbkdf2/salsa20); `cbc` is absent. The
# positive-allowlist gate in .github/workflows/rust.yml admits exactly that
# audited transitive set and fails on anything new.

# `locked:` v1 at-rest crypto (docs/envrypt/crypto-formats.md §2), decrypt path: the
# locked private-key value is
# `locked:<pub>:base64url(0x01||salt(16)||iv(12)||tag(16)||ct)` where the AES-256-GCM key
# is Node `crypto.scryptSync(passphrase, salt, 32)` — scrypt with Node's defaults
# (N=16384 → log2=14, r=8, p=1). Pure-Rust RustCrypto `scrypt` (pulls salsa20 plus the
# already-present pbkdf2/sha2), no openssl-sys or HTTP, default build. The layout is
# frozen: existing `locked:` values must keep decrypting (identical params +
# AES-256-GCM 12-byte IV/16-byte tag).
scrypt = { version = "0.11", default-features = false, features = ["std"] }

# Parser core (see workspace Cargo.toml for rationale).
fancy-regex = { workspace = true }
regex = { workspace = true }
indexmap = { workspace = true }
memchr = { workspace = true }

# serde_json matches Node's `JSON.stringify`/`JSON.parse` byte-for-byte for the
# envs resolver's debug line, the run action's options JSON, and the
# `keypair_metadata` helper. Insertion-ordered (`preserve_order`) because JSON key
# order is contract. Not an HTTP or openssl dep, so the CI `-e normal` gate stays
# green.
serde_json = { workspace = true }

# libc supplies Node-style errno names and messages (`EACCES: permission denied,
# open '<path>'` — resolvers::envs raw row errors; the exec spawn-error strings).
# Numeric errno values differ per OS, so the libc constants are the portable
# source. Unix-only; the Windows spawn path uses a separate seam.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Color-depth branch for Windows: Node's `getColorDepth` reads `os.release()` on
# win32. `windows-version` exposes the OS build number through a safe API (no
# caller-side `unsafe`, honoring the no-unsafe rule) and is target-gated so it never
# enters the macOS/Linux dependency tree; it has no HTTP or openssl deps. This
# branch runs only on Windows, so CI covers it.
[target.'cfg(windows)'.dependencies]
windows-version = "0.1"

# Criterion micro-benches. Each bench binary sets `harness = false` (criterion
# supplies its own `main` via `criterion_main!`).
[[bench]]
name = "parse"
harness = false

[[bench]]
name = "crypto"
harness = false

[[bench]]
name = "keyring"
harness = false
