# cargo-publish — publish the envrypt crate to crates.io via Trusted Publishing.
#
# INTERIM (self-contained) form: envrypt is not yet fully fleet-onboarded (no
# scripts/fleet engine), so this inlines the verify → publish → tag → release
# flow instead of calling `node scripts/fleet/cargo-publish.mts`. Once envrypt
# carries the fleet publish tier, this collapses to the engine call (the fleet
# template/presets/.github/workflows/cargo-publish.yml).
#
# Default flow: manual dispatch, DRY-RUN unless `publish: true`. Publishes via
# crates.io Trusted Publishing (OIDC — id-token: write, NO long-lived token) with
# GitHub build provenance on the .crate. crates.io publishes are PERMANENT (a
# version can only be yanked, never overwritten), so the real run is gated behind
# the `cargo-publish` CI environment (required reviewers).
#
# One-time setup: on crates.io/crates/envrypt/settings add a Trusted Publisher for
# repo SocketDev/envrypt, workflow cargo-publish.yml, environment cargo-publish.

name: 📦 cargo publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish for real (false = dry-run, the default).'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cargo-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Human-approval + OIDC gate on the real, PERMANENT publish; a dry-run is ungated.
    environment: ${{ inputs.publish == true && 'cargo-publish' || '' }}
    permissions:
      contents: write # create the vX.Y.Z tag + the GitHub release
      id-token: write # crates.io Trusted Publishing (OIDC) + provenance
      attestations: write # build provenance for the .crate
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (2025-11-13)
        with:
          persist-credentials: false
      - name: Rust toolchain (fleet nightly pin, from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2026-03-12)

      # STAGE: verify the crate builds from its packaged sources (no upload).
      - name: Verify (cargo publish --dry-run --locked)
        run: cargo publish -p envrypt --dry-run --locked

      # APPROVE (real run only, gated by the cargo-publish environment):
      - name: crates.io auth (OIDC Trusted Publishing)
        id: auth
        if: ${{ inputs.publish == true }}
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1 (2026-06-16)
      - name: Publish to crates.io
        if: ${{ inputs.publish == true }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p envrypt --locked

      # RELEASE: tag + GitHub release with the .crate + provenance.
      - name: Package the .crate for the release + attestation
        if: ${{ inputs.publish == true }}
        run: cargo package -p envrypt --locked
      - name: Attest build provenance (.crate)
        if: ${{ inputs.publish == true }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2 (2025-06-11)
        with:
          subject-path: target/package/envrypt-*.crate
      - name: Tag + GitHub release
        if: ${{ inputs.publish == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="envrypt"))')"
          tag="v${version}"
          crate="target/package/envrypt-${version}.crate"
          sha256="$(shasum -a 256 "$crate" | awk '{print $1}')"
          printf 'sha256: %s  %s\n' "$sha256" "$(basename "$crate")" > checksums.txt
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "tag ${tag} already exists"
          else
            git tag "$tag"
            git push origin "$tag"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release ${tag} already exists; leaving it"
          else
            gh release create "$tag" --verify-tag --draft --title "$tag" \
              --notes "envrypt ${version} — https://crates.io/crates/envrypt/${version}"
            gh release upload "$tag" "$crate" checksums.txt
            gh release edit "$tag" --draft=false
          fi
